{% extends 'main/base.html' %}

{% load static %}

{% block body %}
  
  <input type='text' value="{% url 'train_classifier' %}" id="train-classifier-var" style="display: none;"></input>

  <div id="home-page">
    <div class="naive-bayes-container">
      
      <div class="container-title">
        Multinomial Naive Bayes Classifier
      </div>      

      <div id="train-classifier-btn">
        Train Classifier
      </div>

      <div class="classifier-training-output-container">
        <div class="classifier-training-output">
          <span>Classifier Model Output</span>
          <div class="accuracy">Accuracy: [[ accuracy ]]</div>
          <div class="precision">Precision: [[ precision ]]</div>
          <div class="recall">Recall: [[ recall ]]</div>
          <div class="f1-score">F1 Score: [[ f1Score ]]</div>
          <div class="confusion-mat">Cofusion Matrix: [[ confusionMat ]]</div>
        </div>
      </div>

    </div>
  </div>
{% endblock %}
